<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IwwiShop — IwwiTeam</title>
    
    <!-- Шрифты: Inter для текста, Unbounded для заголовков -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0A0A0A;
            --card-bg: #141414;
            --text-main: #E0E0E0;
            --text-muted: #777777;
            --accent: #FF2D7B; /* Один акцентный цвет */
            --border: #222222;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.5;
            position: relative;
        }

        /* Легкий шум, opacity 0.03 */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 10;
        }

        /* Навигация */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 6vw;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(8px);
            z-index: 100;
        }

        .logo {
            font-family: 'Unbounded', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Стикер с наклоном (неидеальный элемент) */
        .logo-sticker {
            background: var(--accent);
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            transform: rotate(-4deg);
            box-shadow: 2px 2px 0 rgba(255, 45, 123, 0.4);
        }

        .nav-links {
            display: flex;
            gap: 32px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        /* Главный экран: асимметрия, сдвиг влево */
        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding: 120px 6vw 80px;
            max-width: 1400px;
            margin: 0 auto;
            align-items: center;
        }

        .hero-content {
            max-width: 600px;
        }

        .hero h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(3rem, 6vw, 5rem);
            line-height: 1.05;
            letter-spacing: -1.5px;
            margin-bottom: 24px;
            color: #fff;
        }

        .hero h1 span {
            color: var(--accent);
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 40px;
            max-width: 400px;
        }

        .btn-primary {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 999px; /* Контраст форм */
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-primary:hover {
            background: #e01f69;
        }

        /* Правая часть hero с 3D логотипом */
        .hero-visual {
            display: flex;
            justify-content: flex-end;
            position: relative;
        }

        .logo-3d {
            width: 100%;
            max-width: 450px;
            border-radius: 8px;
            object-fit: cover;
        }

        /* Каталог */
        .catalog {
            padding: 80px 6vw;
            max-width: 1400px;
            margin: 0 auto;
        }

        .catalog-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 60px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        .catalog-header h2 {
            font-family: 'Unbounded', sans-serif;
            font-size: 2rem;
            letter-spacing: -0.5px;
        }

        .catalog-header span {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        /* Неравномерные отступы для "человечности" */
        .card:nth-child(2) { margin-top: 12px; }
        .card:nth-child(5) { margin-top: -12px; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 16px;
            transition: border-color 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            border-color: #333;
        }

        .card-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #1A1A1A;
            border-radius: 2px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            overflow: hidden;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card h3 {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.1rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
            flex-grow: 1;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .price {
            font-family: 'Unbounded', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .add-btn {
            background: transparent;
            border: 1px solid #444;
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .add-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Корзина FAB */
        .cart-fab {
            position: fixed;
            bottom: 32px;
            right: 32px;
            background: var(--text-main);
            color: var(--bg);
            border: none;
            padding: 16px 24px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            transition: transform 0.2s ease;
        }

        .cart-fab:hover {
            transform: translateY(-2px);
        }

        .cart-count {
            background: var(--accent);
            color: #fff;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1001;
            display: flex;
            justify-content: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .cart-drawer {
            background: var(--bg);
            width: 100%;
            max-width: 440px;
            height: 100%;
            border-left: 1px solid var(--border);
            padding: 32px;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .cart-drawer {
            transform: translateX(0);
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .cart-header h2 {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.4rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .close-btn:hover { color: var(--text-main); }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 24px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }

        .cart-item-name { font-size: 0.95rem; font-weight: 500; }
        .cart-item-price { font-family: 'Unbounded', sans-serif; font-size: 1rem; }
        
        .remove-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 4px;
            text-decoration: underline;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-family: 'Unbounded', sans-serif;
            font-size: 1.2rem;
            margin-bottom: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .checkout-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .checkout-form label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .checkout-form input {
            width: 100%;
            padding: 14px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .checkout-form input:focus {
            border-color: var(--accent);
        }

        .checkout-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 8px;
        }

        .checkout-btn:hover { background: #e01f69; }

        /* Тосты */
        .toast {
            position: fixed;
            bottom: 100px;
            right: 32px;
            background: #fff;
            color: var(--bg);
            padding: 16px 24px;
            border-radius: 4px;
            font-weight: 500;
            font-size: 0.9rem;
            z-index: 9999;
            transform: translateX(120%);
            transition: transform 0.2s ease;
        }

        .toast.show { transform: translateX(0); }

        /* Адаптив */
        @media (max-width: 900px) {
            .hero { grid-template-columns: 1fr; padding-top: 60px; }
            .hero-visual { justify-content: flex-start; margin-top: 40px; }
            .grid { grid-template-columns: 1fr 1fr; }
            .card:nth-child(2), .card:nth-child(5) { margin-top: 0; }
            .nav-links { display: none; }
        }

        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            .cart-fab { bottom: 20px; right: 20px; }
            .logo-3d { max-width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Навигация -->
    <nav>
        <div class="logo">
            IwwiShop <span class="logo-sticker">IwwiTeam</span>
        </div>
        <div class="nav-links">
            <a href="#catalog">Каталог</a>
            <a href="https://t.me/your_bot_link" target="_blank">Бот</a>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero">
        <div class="hero-content">
            <h1>Цифровые<br>вещи для <span>своих.</span></h1>
            <p>Небольшая студия IwwiTeam делает стикеры, аватарки и оверлеи. Без лишнего пафоса и массового контента.</p>
            <a href="#catalog" class="btn-primary">Смотреть каталог</a>
        </div>
        <div class="hero-visual">
            <!-- Замени logo.png на свою аватарку, если загрузишь её в репозиторий -->
            <img src="logo.png" alt="IwwiTeam" class="logo-3d" onerror="this.style.display='none'">
        </div>
    </section>

    <!-- Каталог -->
    <section class="catalog" id="catalog">
        <div class="catalog-header">
            <h2>Коллекция</h2>
            <span>6 товаров</span>
        </div>
        <div class="grid" id="product-grid">
            <!-- Карточки генерируются JS -->
        </div>
    </section>

    <!-- Корзина -->
    <button class="cart-fab" id="openCart">
        <span>Корзина</span>
        <span class="cart-count" id="cartCount">0</span>
    </button>

    <div class="modal-overlay" id="cartModal">
        <div class="cart-drawer">
            <div class="cart-header">
                <h2>Твой заказ</h2>
                <button class="close-btn" id="closeCart">✕</button>
            </div>
            <div class="cart-items" id="cartItemsContainer"></div>
            <div class="cart-total">
                <span>Итого:</span>
                <span id="cartTotalPrice">0 ₽</span>
            </div>
            <form class="checkout-form" id="checkoutForm">
                <label for="tgInput">Telegram для получения файлов</label>
                <input type="text" id="tgInput" placeholder="@username" required pattern="@?[A-Za-z0-9_]{5,32}" title="Введите ваш Telegram username">
                <button type="submit" class="checkout-btn">Оплатить и получить</button>
            </form>
        </div>
    </div>

    <!-- Тосты -->
    <div id="toast" class="toast">Сообщение</div>

    <script>
        // Данные товаров
        const products = [
            { id: 'soft-forms', name: 'Soft Forms', price: 149, desc: '24 стикера для Telegram. Лаконичные формы.', img: 'https://placehold.co/400x400/1A1A1A/555555?text=Stickers+1' },
            { id: 'odd-hours', name: 'Odd Hours', price: 199, desc: '32 стикера для ночных разговоров.', img: 'https://placehold.co/400x400/1A1A1A/555555?text=Stickers+2' },
            { id: 'tiny-world', name: 'Tiny World', price: 129, desc: '18 объектов для уютных чатов.', img: 'https://placehold.co/400x400/1A1A1A/555555?text=Stickers+3' },
            { id: 'avatars', name: 'Neon Avatars', price: 120, desc: '8 аватарок в неоновом стиле.', img: 'https://placehold.co/400x400/1A1A1A/555555?text=Avatars' },
            { id: 'wallpapers', name: 'Iwwi Wallpapers', price: 100, desc: '12 обоев 4K с маскотом.', img: 'https://placehold.co/400x400/1A1A1A/555555?text=Wallpapers' },
            { id: 'overlays', name: 'OBS Overlays', price: 300, desc: 'Стрим-пак: рамки и алерты.', img: 'https://placehold.co/400x400/1A1A1A/555555?text=Overlays' }
        ];

        let cart = JSON.parse(localStorage.getItem('iwwi_cart')) || [];
        const grid = document.getElementById('product-grid');
        const modal = document.getElementById('cartModal');
        const cartCount = document.getElementById('cartCount');
        const cartItems = document.getElementById('cartItemsContainer');
        const cartTotal = document.getElementById('cartTotalPrice');
        const toast = document.getElementById('toast');

        function renderProducts() {
            grid.innerHTML = products.map(p => `
                <div class="card">
                    <div class="card-image">
                        <img src="${p.img}" alt="${p.name}">
                    </div>
                    <h3>${p.name}</h3>
                    <p>${p.desc}</p>
                    <div class="card-bottom">
                        <span class="price">${p.price} ₽</span>
                        <button class="add-btn" onclick="addToCart('${p.id}')">Добавить</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const item = products.find(p => p.id === id);
            cart.push(item);
            updateCart();
            showToast(`Добавлено: ${item.name}`);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function updateCart() {
            localStorage.setItem('iwwi_cart', JSON.stringify(cart));
            cartCount.textContent = cart.length;
            
            if (cart.length === 0) {
                cartItems.innerHTML = '<p style="color:var(--text-muted);">Пусто</p>';
                cartTotal.textContent = '0 ₽';
                return;
            }

            let total = 0;
            cartItems.innerHTML = cart.map((item, i) => {
                total += item.price;
                return `
                    <div class="cart-item">
                        <div>
                            <div class="cart-item-name">${item.name}</div>
                            <button class="remove-btn" onclick="removeFromCart(${i})">Удалить</button>
                        </div>
                        <div class="cart-item-price">${item.price} ₽</div>
                    </div>
                `;
            }).join('');
            cartTotal.textContent = total + ' ₽';
        }

        document.getElementById('openCart').onclick = () => modal.classList.add('active');
        document.getElementById('closeCart').onclick = () => modal.classList.remove('active');
        modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('active'); };

        let toastTimeout;
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ОТПРАВКА ЗАКАЗА НА CLOUDFLARE WORKER
        document.getElementById('checkoutForm').onsubmit = async (e) => {
            e.preventDefault();
            if (cart.length === 0) return showToast('Корзина пуста');

            const tgUsername = document.getElementById('tgInput').value.replace('@', '');

            try {
                const response = await fetch('https://fancy-frost-f5a6.minesould2.workers.dev/api/order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram: tgUsername,
                        items: cart.map(item => ({ id: item.id, name: item.name }))
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showToast('Успех! Проверь бота в Telegram.');
                    cart = [];
                    updateCart();
                    modal.classList.remove('active');
                    document.getElementById('tgInput').value = '';
                } else {
                    showToast(data.error || 'Ошибка при заказе.');
                }
            } catch (err) {
                showToast('Ошибка сети.');
            }
        };

        renderProducts();
        updateCart();
    </script>
</body>
</html>
